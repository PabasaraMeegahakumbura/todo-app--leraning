apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: ghcr.io/pabasarameegahakumbura/todo-app--leraning:9b5ebf58bc725b9031aea9b81c4a7ff9612b8c8e
          ports:
            - containerPort: 3000

          startupProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: GREETING     
            - name: MYSQL_HOST
              value: todo-mysql
            - name: MYSQL_DB
              value: todos
            - name: MYSQL_USER
              value: todo_app
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-app-db-secret
                  key: password

