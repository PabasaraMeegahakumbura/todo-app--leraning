apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: ghcr.io/pabasarameegahakumbura/todo-app--leraning:ae9e9d2903d4809f2ee3b688ed48255aa4f5dc68
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: todo-storage
              mountPath: /etc/todos
          startupProbe:
            httpGet:
              path: /api/greeting
              port: 3000
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/greeting
              port: 3000
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/greeting
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: GREETING     
            - name: MYSQL_HOST
              value: todo-mysql
            - name: MYSQL_DB
              value: todos
            - name: MYSQL_USER
              value: todo_app
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-app-db-secret
                  key: password

      volumes:
        - name: todo-storage
          persistentVolumeClaim:
            claimName: todo-data