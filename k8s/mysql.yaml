apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-mysql
  template:
    metadata:
      labels:
        app: todo-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:9.3
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-mysql-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: todos
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          startupProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - "127.0.0.1"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - "127.0.0.1"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3              
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: todo-mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: todo-mysql
spec:
  selector:
    app: todo-mysql
  ports:
    - port: 3306
      targetPort: 3306