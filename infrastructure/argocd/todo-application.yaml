apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PabasaraMeegahakumbura/todo-app--leraning.git
    targetRevision: main
    path: k8s
    directory:
      exclude: pvc.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
    syncOptions:
      - Prune=false
      - Delete=false